{{- /* Comportamiento del sitio: menú móvil, filtros de galería y visor de fotos.
       Sin dependencias; el contenido se ve completo aunque el script no cargue. */ -}}
<script>
(function () {
  var menuBtn = document.querySelector('[data-menu]');
  var nav = document.getElementById('nav-principal');
  if (menuBtn && nav) {
    menuBtn.addEventListener('click', function () {
      var abierto = nav.classList.toggle('is-open');
      menuBtn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
    });
    nav.addEventListener('click', function (e) {
      if (e.target.closest('a')) { nav.classList.remove('is-open'); menuBtn.setAttribute('aria-expanded', 'false'); }
    });
  }

  // Filtros: botones [data-filtro] muestran solo las fotos de ese evento.
  var filtros = document.querySelectorAll('[data-filtro]');
  var contador = document.querySelector('[data-contador]');
  function visibles() {
    return Array.prototype.filter.call(document.querySelectorAll('[data-foto]'), function (f) { return !f.hidden; });
  }
  filtros.forEach(function (b) {
    b.addEventListener('click', function () {
      var clave = b.getAttribute('data-filtro');
      filtros.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
      document.querySelectorAll('[data-foto]').forEach(function (f) {
        f.hidden = !(clave === 'todas' || f.getAttribute('data-evento') === clave);
      });
      if (contador) contador.textContent = visibles().length + ' fotos';
    });
  });

  // Visor
  var visor = document.querySelector('[data-visor]');
  if (!visor) return;
  var img = visor.querySelector('[data-visor-img]');
  var tag = visor.querySelector('[data-visor-tag]');
  var alt = visor.querySelector('[data-visor-alt]');
  var pos = visor.querySelector('[data-visor-pos]');
  var lista = [], i = 0, origen = null;
  function mostrar(n) {
    i = (n + lista.length) % lista.length;
    var f = lista[i];
    img.src = f.getAttribute('data-grande');
    img.alt = f.getAttribute('data-alt');
    tag.textContent = f.getAttribute('data-tag');
    alt.textContent = f.getAttribute('data-alt');
    pos.textContent = (i + 1) + ' de ' + lista.length;
  }
  function abrir(f) {
    lista = visibles(); origen = f;
    visor.hidden = false; document.body.style.overflow = 'hidden';
    mostrar(lista.indexOf(f));
    visor.querySelector('[data-visor-cerrar]').focus();
  }
  function cerrar() {
    visor.hidden = true; document.body.style.overflow = ''; img.src = '';
    if (origen) origen.focus();
  }
  document.addEventListener('click', function (e) {
    var f = e.target.closest('[data-foto]');
    if (f) abrir(f);
  });
  visor.querySelector('[data-visor-cerrar]').addEventListener('click', cerrar);
  visor.querySelector('[data-visor-ant]').addEventListener('click', function () { mostrar(i - 1); });
  visor.querySelector('[data-visor-sig]').addEventListener('click', function () { mostrar(i + 1); });
  visor.addEventListener('click', function (e) { if (e.target === visor) cerrar(); });
  document.addEventListener('keydown', function (e) {
    if (visor.hidden) return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft') mostrar(i - 1);
    else if (e.key === 'ArrowRight') mostrar(i + 1);
  });
})();
</script>
