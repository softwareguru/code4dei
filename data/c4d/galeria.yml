### Galería de fotos (portada y /galeria/)
#
# Cada foto vive en static/images/c4d/galeria/ en dos tamaños:
#   <archivo>.jpg     grande, para la vista ampliada (1400 px)
#   <archivo>-sm.jpg  miniatura, para la rejilla (640 px)
#
# Campos:
#   archivo  nombre sin extensión
#   evento   clave del evento (ver `eventos` abajo); define el filtro y la etiqueta
#   alt      descripción de la foto para lectores de pantalla
#   portada  número de orden si la foto aparece en la portada (la 1 va en grande)
#
# El orden de la lista es el orden en /galeria/.

eventos:
  - clave: dd4w-cdmx-2026
    nombre: "Dev Day 4 Women CDMX 2026"
    etiqueta: "CDMX"
  - clave: dd4w-mty-2026
    nombre: "Dev Day 4 Women MTY 2026"
    etiqueta: "MTY"

