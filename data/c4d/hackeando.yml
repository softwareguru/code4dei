descripcion: >-
  Hackeando barreras por la inclusión es un congreso donde exploramos cómo la
  inclusión laboral de personas con discapacidad no solo es un acto de equidad
  social, sino una estrategia poderosa para el éxito de tu negocio.

organizan: >-
  Una iniciativa de Impact Click, fundación sin fines de lucro que impulsa
  proyectos tecnológicos con impacto social, y de Code 4 DEI, iniciativa de
  Software Guru que promueve una industria tecnológica diversa e incluyente.

descubre:
  - titulo: "Acceso a una fuerza laboral talentosa"
    texto: "Cómo las personas con discapacidad aportan habilidades únicas, como creatividad y resolución de problemas, que enriquecen cualquier equipo."
    tono: rosa
  - titulo: "Impacto económico"
    texto: "Cómo la inclusión contribuye al crecimiento económico, aumenta la productividad y dinamiza la economía local y nacional."
    tono: verde
  - titulo: "Mejor clima laboral"
    texto: "Cómo la diversidad aumenta la motivación y la satisfacción del personal, y crea un ambiente de trabajo más colaborativo."
    tono: amarillo
  - titulo: "Incentivos fiscales"
    texto: "Los beneficios fiscales, deducciones y subvenciones disponibles para las empresas que apuestan por la inclusión."
    tono: morado

