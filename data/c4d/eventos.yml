### Eventos de Code 4 DEI
#
# proximos: tarjetas de "Próximos eventos" en la portada (máximo 3 se muestran).
#   Mientras la lista esté vacía, la portada invita a seguir el calendario y
#   no muestra la tarjeta de "Siguiente evento" en el hero.
#   Campos: titulo, fecha (AAAA-MM-DD), hora, lugar, modalidad, url (Luma),
#           landing (opcional, la página del evento en este sitio),
#           imagen (opcional, dentro de /static), etiqueta (opcional, p. ej. "Gratuito"),
#           extras (opcional, lista de chips), ajuste: contain (opcional, para
#           pósters cuadrados que no deben recortarse).
#   Un evento cuya fecha ya pasó deja de mostrarse en el siguiente build.
#
# calendario: link al calendario público de Luma (botón "Ver calendario").
#
# pasados: tarjetas de "Eventos que ya pasaron".

